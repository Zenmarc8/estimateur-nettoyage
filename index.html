<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estimateur Pro - Nettoyage & Ventilation Financière</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; font-size: 11pt; }
      .print-shadow { box-shadow: none !important; border: 1px solid #ddd !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header principal -->
  <header class="bg-blue-900 text-white shadow-lg no-print">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-calculator text-amber-400"></i> Estimateur & Relevé de Chantier
        </h1>
        <p class="text-xs text-blue-200 mt-1">Norme ISSA 540 + Modèle financier (158,00 $/h production | 98,75 $/h route)</p>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-sample" class="bg-blue-800 hover:bg-blue-700 text-xs px-3 py-2 rounded font-medium border border-blue-600 transition">
          <i class="fa-solid fa-folder-open mr-1"></i> Charger exemple
        </button>
        <button id="btn-reset" class="bg-rose-800 hover:bg-rose-700 text-xs px-3 py-2 rounded font-medium transition">
          <i class="fa-solid fa-trash mr-1"></i> Effacer tout
        </button>
        <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 text-xs px-4 py-2 rounded font-bold transition">
          <i class="fa-solid fa-print mr-1"></i> Imprimer / PDF
        </button>
      </div>
    </div>
  </header>
